/* Layout concept: a floating glass nav, a bold name over a soft colour glow, then one rounded card per service that opens into its gallery. Contact closes the page in a gradient-framed card, signed in small type. */
:root {
  --bg: #0a0c11;
  --card: #12151d;
  --card2: #1a1e29;
  --line: #262b39;
  --fg: #f1f3f8;
  --muted: #98a1b3;
  --accent: #4fe3cf;
  --accent2: #5b9bff;
  --grad: linear-gradient(120deg, #4fe3cf 0%, #5b9bff 100%);
  --accent-ink: #04201c;
  --glow1: rgba(79, 227, 207, .16);
  --glow2: rgba(91, 155, 255, .15);
  --nav-bg: rgba(14, 16, 22, .72);
  --danger: #ff8575;
  --danger-ink: #2a0c07;
  --font-display: 'Syne', 'Helvetica Neue', Arial, sans-serif;
  --font-body: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f3f5f9;
    --card: #ffffff;
    --card2: #eef1f6;
    --line: #dde2ec;
    --fg: #111522;
    --muted: #596376;
    --accent: #0a8f80;
    --accent2: #2563eb;
    --grad: linear-gradient(120deg, #0a8f80 0%, #2563eb 100%);
    --accent-ink: #ffffff;
    --glow1: rgba(10, 143, 128, .12);
    --glow2: rgba(37, 99, 235, .10);
    --nav-bg: rgba(255, 255, 255, .78);
    --danger: #b8372a;
    --danger-ink: #ffffff;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f3f5f9;
  --card: #ffffff;
  --card2: #eef1f6;
  --line: #dde2ec;
  --fg: #111522;
  --muted: #596376;
  --accent: #0a8f80;
  --accent2: #2563eb;
  --grad: linear-gradient(120deg, #0a8f80 0%, #2563eb 100%);
  --accent-ink: #ffffff;
  --glow1: rgba(10, 143, 128, .12);
  --glow2: rgba(37, 99, 235, .10);
  --nav-bg: rgba(255, 255, 255, .78);
  --danger: #b8372a;
  --danger-ink: #ffffff;
  color-scheme: light;
}

*, *::before, *::after { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 400 16px/1.6 var(--font-body); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
#app {
  position: relative; overflow-x: clip;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 40px;
}
.glow { position: absolute; left: 0; right: 0; top: 0; height: 680px; pointer-events: none; background: radial-gradient(60% 70% at 12% 0%, var(--glow1), transparent 70%), radial-gradient(50% 60% at 92% 8%, var(--glow2), transparent 70%); }
.col { position: relative; z-index: 1; max-width: 1080px; margin-inline: auto; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

/* Floating nav */
.nav { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 10px); z-index: 20; display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 10px; padding: 8px 8px 8px 18px; border: 1px solid var(--line); border-radius: 999px; background: var(--nav-bg); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; font: 600 14px/1 var(--font-body); }
.brand .dot { flex: none; width: 9px; height: 9px; border-radius: 50%; background: var(--grad); }
.nav .btn { flex: none; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 10px 22px; border-radius: 999px; border: 1px solid transparent; background: var(--grad); color: var(--accent-ink); font: 600 15px/1.2 var(--font-body); text-decoration: none; cursor: pointer; transition: transform .15s ease, opacity .15s ease, border-color .15s ease; }
.btn:hover { transform: translateY(-1px); }
.btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
.btn.ghost { background: transparent; color: var(--fg); border-color: var(--line); }
.btn.ghost:hover { border-color: var(--fg); }
.btn.small { min-height: 38px; padding: 6px 16px; font-size: 14px; }

/* Hero */
.hero { display: grid; grid-template-columns: minmax(0, 1fr); gap: 36px; align-items: center; padding-block: 52px 44px; }
.hero-text { display: flex; flex-direction: column; gap: 22px; min-width: 0; }
.eyebrow { margin: 0; font: 500 12px/1 var(--font-mono); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.name { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
h1 { margin: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; font: 800 clamp(1.4rem, 5.4vw, 2.9rem)/1.1 var(--font-display); letter-spacing: 0; }
h1 span { white-space: nowrap; }
h1 .grad { padding: 0 .18em .06em 0; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent; }
.byline { margin: 0; font: 300 14px/1 var(--font-body); letter-spacing: .22em; color: var(--muted); }
.lead { margin: 0; max-width: 56ch; font-size: 1.0625rem; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 40px; padding: 8px 16px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--fg); font: 500 14px/1 var(--font-body); cursor: pointer; transition: border-color .2s ease, transform .15s ease; }
.chip:hover { border-color: var(--accent); transform: translateY(-1px); }
.cta { display: flex; flex-wrap: wrap; gap: 12px; }
@media (min-width: 761px) {
  .hero.has-hero { grid-template-columns: minmax(0, 1fr) minmax(0, 340px); gap: 56px; }
  .hero.has-hero h1 { font-size: clamp(1.4rem, 3.4vw, 2.9rem); }
}
.hero-box { min-width: 0; }
.hero-photo { display: block; width: 100%; max-width: 100%; aspect-ratio: 4 / 5; object-fit: cover; border-radius: 28px; background: var(--card2); box-shadow: 0 0 0 1px var(--line), 0 40px 70px -40px rgba(0, 0, 0, .7); }
.hero-empty { display: grid; place-items: center; width: 100%; aspect-ratio: 4 / 3; padding: 20px; border: 1px dashed var(--line); border-radius: 28px; color: var(--muted); text-align: center; font-size: 14px; }
.hero-tools { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
.hero-box .status { margin-top: 8px; }

/* Admin bar */
.adminbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin-bottom: 28px; padding: 12px 16px; border: 1px solid var(--accent); border-radius: 16px; background: var(--card); font-size: 14px; }
.adminbar .tag { padding: 5px 9px; border-radius: 6px; background: var(--grad); color: var(--accent-ink); font: 500 11px/1 var(--font-mono); letter-spacing: .14em; }
.adminbar p { margin: 0; min-width: 0; color: var(--muted); }

/* Service cards */
.rows-label { margin: 0 0 14px; font: 500 12px/1.4 var(--font-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.rows { display: flex; flex-direction: column; gap: 12px; }
.row { scroll-margin-top: calc(env(safe-area-inset-top, 0px) + 84px); border: 1px solid var(--line); border-radius: 24px; background: var(--card); transition: border-color .2s ease, box-shadow .3s ease; }
.row:hover { border-color: var(--muted); }
.row.is-open { border-color: var(--accent); box-shadow: 0 24px 60px -36px var(--glow1); }
.row h2 { margin: 0; font: inherit; }
.row-head { display: flex; align-items: center; gap: 16px; width: 100%; padding: 20px 22px; text-align: left; cursor: pointer; background: none; border: 0; border-radius: 24px; }
.row-ico { flex: none; display: grid; place-items: center; width: 54px; height: 54px; border-radius: 16px; background: var(--card2); color: var(--accent); }
.row-ico svg { width: 26px; height: 26px; }
.row-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.row-title { font: 700 clamp(1.15rem, 3.6vw, 1.7rem)/1.15 var(--font-display); letter-spacing: -.01em; text-wrap: balance; }
.row-desc { color: var(--muted); font-size: 14.5px; }
.row-count { align-self: flex-start; padding: 4px 10px; border-radius: 999px; background: var(--card2); font: 500 12px/1.2 var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.row-thumb { flex: none; width: 112px; height: 78px; border-radius: 14px; object-fit: cover; background: var(--card2); }
.row-arrow { flex: none; position: relative; width: 44px; height: 44px; border: 1px solid var(--line); border-radius: 50%; transition: transform .25s ease, background .2s ease, border-color .2s ease; }
.row-arrow::before, .row-arrow::after { content: ""; position: absolute; left: 50%; top: 50%; width: 14px; height: 2px; margin: -1px 0 0 -7px; border-radius: 1px; background: var(--fg); }
.row-arrow::after { transform: rotate(90deg); }
.row-head:hover .row-arrow { background: var(--grad); border-color: transparent; }
.row-head:hover .row-arrow::before, .row-head:hover .row-arrow::after { background: var(--accent-ink); }
.row.is-open .row-arrow { transform: rotate(45deg); border-color: var(--accent); }
.row-body { padding: 0 22px 24px; display: flex; flex-direction: column; gap: 18px; animation: open .25s ease; }
@keyframes open { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }

/* Gallery */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr)); gap: 10px; }
.tile { position: relative; margin: 0; aspect-ratio: 4 / 3; max-width: 100%; overflow: hidden; border-radius: 14px; background: var(--card2); }
.tile-btn { display: block; width: 100%; height: 100%; padding: 0; border: 0; background: none; cursor: zoom-in; }
.tile img, .tile video { display: block; width: 100%; height: 100%; object-fit: cover; transition: transform .35s ease; }
.tile-btn:hover img, .tile-btn:hover video { transform: scale(1.04); }
.play { position: absolute; left: 50%; top: 50%; display: grid; place-items: center; width: 48px; height: 48px; margin: -24px 0 0 -24px; border-radius: 50%; background: rgba(10, 12, 16, .62); color: #fff; pointer-events: none; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.tile-link { display: flex; flex-direction: column; justify-content: flex-end; gap: 4px; width: 100%; height: 100%; padding: 16px; color: var(--fg); text-decoration: none; background: var(--card2); border: 1px solid var(--line); border-radius: 14px; }
.tile-link .play { left: 16px; top: 16px; margin: 0; background: var(--grad); color: var(--accent-ink); backdrop-filter: none; -webkit-backdrop-filter: none; }
.tile-link:hover { border-color: var(--accent); }
.tile-title { font: 700 1.15rem/1.2 var(--font-display); overflow-wrap: anywhere; }
.tile-host { font: 400 12px/1.2 var(--font-mono); color: var(--muted); overflow-wrap: anywhere; }
.del { position: absolute; top: 8px; right: 8px; padding: 7px 12px; border: 0; border-radius: 999px; background: rgba(10, 12, 16, .72); color: #fff; font: 500 12px/1 var(--font-body); cursor: pointer; }
.del.confirm { background: var(--danger); color: var(--danger-ink); }
.empty { margin: 0; padding: 28px 20px; border: 1px dashed var(--line); border-radius: 14px; color: var(--muted); }

/* Admin tools */
.tools { display: flex; flex-direction: column; gap: 12px; padding: 16px; border: 1px solid var(--line); border-radius: 16px; background: var(--card2); }
.tools-actions { display: flex; flex-wrap: wrap; gap: 10px; }
.hint { margin: 0; font-size: 13px; color: var(--muted); }
.status { margin: 0; min-height: 1.4em; font: 400 13px/1.4 var(--font-mono); color: var(--fg); overflow-wrap: anywhere; }
.status.err { color: var(--danger); }
.linkform { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 12px; align-items: end; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field label { font: 500 12px/1 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.field input { width: 100%; min-height: 46px; padding: 8px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); color: var(--fg); }
.linkform .actions { display: flex; flex-wrap: wrap; gap: 10px; grid-column: 1 / -1; }

/* Contact */
.contact { padding-block: 64px 0; }
.contact-card { display: flex; flex-direction: column; gap: 24px; padding: clamp(24px, 5vw, 52px); border: 1px solid transparent; border-radius: 28px; background: linear-gradient(var(--card), var(--card)) padding-box, var(--grad) border-box; }
.contact h2 { margin: 0; font: 800 clamp(1.8rem, 5.6vw, 3.2rem)/1.05 var(--font-display); letter-spacing: -.015em; text-wrap: balance; }
.contact p { margin: 0; max-width: 52ch; color: var(--muted); }
.contact-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 12px; margin: 0; padding: 0; list-style: none; }
.contact-item { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; padding: 16px 18px; border: 1px solid var(--line); border-radius: 16px; background: var(--card2); min-width: 0; }
.contact-item .k { flex-basis: 100%; font: 500 12px/1 var(--font-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.contact-item .v { min-width: 0; font: 500 1.05rem/1.3 var(--font-body); overflow-wrap: anywhere; user-select: all; }
.sign { margin: 44px 0 0; padding-top: 22px; border-top: 1px solid var(--line); text-align: center; font: 300 13px/1 var(--font-body); letter-spacing: .22em; text-transform: none; color: var(--muted); }

/* Lightbox */
.lb { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; background: rgba(8, 9, 12, .94); padding: calc(64px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(56px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.lb-stage { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; min-width: 0; }
.lb-stage img, .lb-stage video { max-width: 100%; max-height: 100%; border-radius: 8px; background: #000; }
.lb button { position: absolute; display: grid; place-items: center; width: 44px; height: 44px; border: 1px solid rgba(255, 255, 255, .28); border-radius: 50%; background: rgba(20, 22, 28, .8); color: #fff; cursor: pointer; font-size: 20px; line-height: 1; }
.lb button:hover { border-color: #fff; }
.lb-close { top: calc(10px + env(safe-area-inset-top, 0px)); right: calc(10px + env(safe-area-inset-right, 0px)); }
.lb-prev { left: calc(8px + env(safe-area-inset-left, 0px)); top: 50%; margin-top: -22px; }
.lb-next { right: calc(8px + env(safe-area-inset-right, 0px)); top: 50%; margin-top: -22px; }
.lb-count { position: absolute; left: 0; right: 0; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); text-align: center; font: 400 13px/1 var(--font-mono); color: #d5d8de; }

.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 60; transform: translateX(-50%); max-width: calc(100% - 32px); padding: 10px 18px; border-radius: 999px; background: var(--fg); color: var(--bg); font: 500 14px/1.3 var(--font-body); }

@media (max-width: 700px) {
  .row-thumb { display: none; }
  .row-head { padding: 16px; gap: 12px; }
  .row-ico { width: 46px; height: 46px; border-radius: 14px; }
  .row-ico svg { width: 22px; height: 22px; }
  .row-body { padding: 0 14px 18px; }
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
}
@media (max-width: 560px) {
  .hero { padding-block: 40px 32px; }
  .cta .btn { flex: 1 1 100%; }
  .hero-tools .btn.small, .tools-actions .btn { flex: 1 1 auto; }
  .contact { padding-block: 48px 0; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

</style>

      icon: '<svg ' + ICON_ATTR + '><path d="M12 3l6 8-6 10-6-10z"/><circle cx="12" cy="11" r="1.6"/><path d="M12 12.6V21"/></svg>' },
    { id: "cadrage-montage", name: "Cadrage & montage vidéo", short: "Cadrage & montage", desc: "Tournage, cadrage, étalonnage et montage de vos contenus.",
      icon: '<svg ' + ICON_ATTR + '><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M8 5v14M16 5v14M3 10h5M16 10h5M3 14h5M16 14h5"/></svg>' },
    { id: "motion-design", name: "Motion design & animation", short: "Motion design", desc: "Logos animés, génériques et vidéos animées.",
      icon: '<svg ' + ICON_ATTR + '><circle cx="12" cy="12" r="9"/><path d="M10 8.5v7l6-3.5z"/></svg>' }
  ];
  var OWNER = "Claude ALLOZOUNHOUE";
  var SIGNATURE = "Mr Claudy";
  var WA_NUMBER = "22997236386";
  var WA_DISPLAY = "+229 97 23 63 86";
  var MAIL = "claudeallozounhoue@gmail.com";
  var WA_URL = "https://wa.me/" + WA_NUMBER + "?text=" + encodeURIComponent("Bonjour, je vous contacte depuis votre portfolio.");
  var DATA = window.PORTFOLIO_DATA || { items: {}, hero: false };

  var openSet = {};
  var sections = {};
  var toastEl, toastTimer;

  function el(tag, attrs, kids) {
    var n = document.createElement(tag);
    if (attrs) {
      Object.keys(attrs).forEach(function (k) {
        var v = attrs[k];
        if (v === false || v == null) return;
        if (k === "class") n.className = v;
        else if (k === "text") n.textContent = v;
        else n.setAttribute(k, v === true ? "" : v);
      });
    }
    (kids || []).forEach(function (c) {
      if (c == null) return;
      n.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    });
    return n;
  }
  function icon(svg, cls) {
    var s = el("span", { class: cls, "aria-hidden": "true" });
    s.innerHTML = svg;
    return s;
  }
  var PLAY_SVG = '<svg viewBox="0 0 24 24" width="20" height="20"><path d="M8 5.5v13l11-6.5z" fill="currentColor"/></svg>';

  function itemsOf(id) { return DATA.items[id] || []; }
  function countLabel(n) {
    if (!n) return "Bientôt";
    return String(n).padStart(2, "0") + (n > 1 ? " réalisations" : " réalisation");
  }

  function render() {
    var app = document.getElementById("app");
    app.textContent = "";
    app.appendChild(el("div", { class: "glow", "aria-hidden": "true" }));
    var col = el("div", { class: "col" });

    col.appendChild(el("nav", { class: "nav", "aria-label": "Navigation" }, [
      el("span", { class: "brand" }, [el("span", { class: "dot", "aria-hidden": "true" }), el("span", { text: "Portfolio" })]),
      el("a", { class: "btn small", href: WA_URL, target: "_blank", rel: "noopener noreferrer", text: "WhatsApp" })
    ]));

    var chips = el("div", { class: "chips" }, CATS.map(function (c) {
      var b = el("button", { type: "button", class: "chip", text: c.short });
      b.addEventListener("click", function () { openAndScroll(c.id); });
      return b;
    }));
    var textCol = el("div", { class: "hero-text" }, [
      el("p", { class: "eyebrow", text: "Portfolio" }),
      el("div", { class: "name" }, [
        el("h1", { "aria-label": OWNER }, [el("span", { text: "Claude" }), el("span", { class: "grad", text: "ALLOZOUNHOUE" })]),
        el("p", { class: "byline", text: SIGNATURE })
      ]),
      el("p", { class: "lead", text: "Photographie, design graphique, montage vidéo et motion design. Choisissez un service pour voir mes réalisations, puis écrivez-moi directement sur WhatsApp." }),
      chips,
      el("div", { class: "cta" }, [
        el("a", { class: "btn", href: WA_URL, target: "_blank", rel: "noopener noreferrer", text: "Écrire sur WhatsApp" }),
        el("a", { class: "btn ghost", href: "mailto:" + MAIL, text: "Envoyer un e-mail" })
      ])
    ]);
    var heroBox = el("div", { class: "hero-box", hidden: !DATA.hero });
    if (DATA.hero) heroBox.appendChild(el("img", { class: "hero-photo", src: "img/hero.jpg", alt: OWNER + " au travail", decoding: "async" }));
    col.appendChild(el("header", { class: "hero" + (DATA.hero ? " has-hero" : "") }, [textCol, heroBox]));

    col.appendChild(el("p", { class: "rows-label", text: "Mes services" }));
    var rows = el("div", { class: "rows" });
    CATS.forEach(function (c) { rows.appendChild(buildRow(c)); });
    col.appendChild(rows);
    col.appendChild(buildContact());
    app.appendChild(col);
    app.appendChild(buildLightbox());
    toastEl = el("div", { class: "toast", role: "status", "aria-live": "polite", hidden: true });
    app.appendChild(toastEl);
  }

  function buildRow(c) {
    var items = itemsOf(c.id);
    var panelId = "panel-" + c.id;
    var thumbItem = items.filter(function (i) { return i.type === "image"; })[0];
    var kids = [
      icon(c.icon, "row-ico"),
      el("span", { class: "row-text" }, [
        el("span", { class: "row-title", text: c.name }),
        el("span", { class: "row-desc", text: c.desc }),
        el("span", { class: "row-count", text: countLabel(items.length) })
      ])
    ];
    if (thumbItem) kids.push(el("img", { class: "row-thumb", src: thumbItem.t, alt: "", loading: "lazy", decoding: "async" }));
    kids.push(el("span", { class: "row-arrow", "aria-hidden": "true" }));
    var head = el("button", { type: "button", class: "row-head", "aria-expanded": "false", "aria-controls": panelId }, kids);
    var body = el("div", { class: "row-body", id: panelId, hidden: true });
    var sec = el("section", { class: "row", id: "cat-" + c.id }, [el("h2", null, [head]), body]);
    sections[c.id] = { cat: c, sec: sec, head: head, body: body, built: false };
    head.addEventListener("click", function () { setOpen(c.id, !openSet[c.id]); });
    return sec;
  }

  function setOpen(id, open) {
    var r = sections[id];
    if (!r) return;
    if (open) openSet[id] = true; else delete openSet[id];
    r.sec.classList.toggle("is-open", !!open);
    r.head.setAttribute("aria-expanded", open ? "true" : "false");
    r.body.hidden = !open;
    if (open && !r.built) fillGrid(r);
  }

  function openAndScroll(id) {
    setOpen(id, true);
    var reduce = false;
    try { reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) {}
    try { sections[id].sec.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "start" }); } catch (e) {}
  }

  var PAGE = 60;
  function fillGrid(r) {
    r.built = true;
    var items = itemsOf(r.cat.id);
    if (!items.length) {
      r.body.appendChild(el("p", { class: "empty", text: "Les réalisations de cette catégorie arrivent bientôt. En attendant, écrivez-moi pour voir des exemples." }));
      return;
    }
    var viewable = items.filter(function (i) { return i.type === "image"; });
    var grid = el("div", { class: "grid" });
    r.body.appendChild(grid);
    var shown = 0;
    var more = el("button", { type: "button", class: "btn ghost", text: "Voir plus" });
    var moreWrap = el("div", { class: "more" }, [more]);
    function addMore() {
      items.slice(shown, shown + PAGE).forEach(function (it) {
        var tile = el("figure", { class: "tile" });
        if (it.type === "link") {
          var host = "";
          try { host = new URL(it.url).hostname.replace(/^www\./, ""); } catch (e) {}
          tile.appendChild(el("a", { class: "tile-link", href: it.url, target: "_blank", rel: "noopener noreferrer" }, [
            icon(PLAY_SVG, "play"),
            el("span", { class: "tile-title", text: it.title || "Voir la vidéo" }),
            el("span", { class: "tile-host", text: host })
          ]));
        } else {
          var btn = el("button", { type: "button", class: "tile-btn", "aria-label": "Agrandir la photo" }, [
            el("img", { src: it.t, alt: r.cat.name + " : réalisation", loading: "lazy", decoding: "async" })
          ]);
          btn.addEventListener("click", function () { openLb(viewable, viewable.indexOf(it), btn); });
          tile.appendChild(btn);
        }
        grid.appendChild(tile);
      });
      shown = Math.min(items.length, shown + PAGE);
      moreWrap.hidden = shown >= items.length;
      more.textContent = "Voir plus (" + (items.length - shown) + " restantes)";
    }
    more.addEventListener("click", addMore);
    r.body.appendChild(moreWrap);
    addMore();
  }

  function buildContact() {
    function item(label, text, copyLabel) {
      var v = el("span", { class: "v", text: text });
      var b = el("button", { type: "button", class: "btn ghost small", text: "Copier", "aria-label": copyLabel });
      b.addEventListener("click", function () { copyText(text, v); });
      return el("li", { class: "contact-item" }, [el("span", { class: "k", text: label }), v, b]);
    }
    return el("footer", { class: "contact" }, [
      el("div", { class: "contact-card" }, [
        el("h2", { text: "Parlons de votre projet" }),
        el("p", { text: "Indiquez le service qui vous intéresse, la date souhaitée et quelques mots sur votre besoin." }),
        el("div", { class: "cta" }, [
          el("a", { class: "btn", href: WA_URL, target: "_blank", rel: "noopener noreferrer", text: "Écrire sur WhatsApp" }),
          el("a", { class: "btn ghost", href: "mailto:" + MAIL, text: "Envoyer un e-mail" })
        ]),
        el("ul", { class: "contact-list" }, [
          item("WhatsApp", WA_DISPLAY, "Copier le numéro WhatsApp"),
          item("E-mail", MAIL, "Copier l’adresse e-mail")
        ])
      ])
    ]);
  }

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.hidden = true; }, 2200);
  }
  function selectNode(node) {
    try {
      var range = document.createRange();
      range.selectNodeContents(node);
      var sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    } catch (e) {}
  }
  function copyText(text, node) {
    var fail = function () { selectNode(node); toast("Texte sélectionné, copiez-le à la main"); };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () { toast("Copié"); }, fail);
      } else fail();
    } catch (e) { fail(); }
  }

  /* Lightbox */
  var lb, lbStage, lbCount, lbPrev, lbNext, lbClose, lbList = [], lbIdx = 0, lbOpener = null, touchX = null;
  function buildLightbox() {
    lbStage = el("div", { class: "lb-stage" });
    lbCount = el("p", { class: "lb-count" });
    lbClose = el("button", { type: "button", class: "lb-close", "aria-label": "Fermer", text: "✕" });
    lbPrev = el("button", { type: "button", class: "lb-prev", "aria-label": "Précédent", text: "‹" });
    lbNext = el("button", { type: "button", class: "lb-next", "aria-label": "Suivant", text: "›" });
    lb = el("div", { class: "lb", hidden: true, role: "dialog", "aria-modal": "true", "aria-label": "Aperçu" }, [lbStage, lbClose, lbPrev, lbNext, lbCount]);
    lbClose.addEventListener("click", closeLb);
    lbPrev.addEventListener("click", function () { stepLb(-1); });
    lbNext.addEventListener("click", function () { stepLb(1); });
    lb.addEventListener("click", function (e) { if (e.target === lb || e.target === lbStage) closeLb(); });
    lb.addEventListener("touchstart", function (e) { touchX = e.touches.length === 1 ? e.touches[0].clientX : null; }, { passive: true });
    lb.addEventListener("touchend", function (e) {
      if (touchX == null) return;
      var dx = e.changedTouches[0].clientX - touchX;
      touchX = null;
      if (Math.abs(dx) > 50) stepLb(dx < 0 ? 1 : -1);
    }, { passive: true });
    return lb;
  }
  function openLb(list, i, opener) {
    lbList = list; lbIdx = Math.max(0, i); lbOpener = opener;
    lb.hidden = false;
    document.documentElement.style.overflow = "hidden";
    showLb();
    lbClose.focus();
  }
  function showLb() {
    var it = lbList[lbIdx];
    lbStage.textContent = "";
    if (!it) return;
    lbStage.appendChild(el("img", { src: it.f, alt: "" }));
    var multi = lbList.length > 1;
    lbPrev.hidden = !multi; lbNext.hidden = !multi;
    lbCount.textContent = multi ? (lbIdx + 1) + " / " + lbList.length : "";
    [1, -1].forEach(function (d) {
      var n = lbList[(lbIdx + d + lbList.length) % lbList.length];
      if (n && n !== it) { var p = new Image(); p.src = n.f; }
    });
  }
  function stepLb(d) {
    if (lbList.length < 2) return;
    lbIdx = (lbIdx + d + lbList.length) % lbList.length;
    showLb();
  }
  function closeLb() {
    lbStage.textContent = "";
    lb.hidden = true;
    document.documentElement.style.overflow = "";
    if (lbOpener && lbOpener.focus) lbOpener.focus();
  }
  document.addEventListener("keydown", function (e) {
    if (!lb || lb.hidden) return;
    if (e.key === "Escape") closeLb();
    else if (e.key === "ArrowLeft") stepLb(-1);
    else if (e.key === "ArrowRight") stepLb(1);
  });

  render();
})();

</script>
</body>
